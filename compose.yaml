services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: robotlit
      POSTGRES_USER: robotlit
      POSTGRES_PASSWORD: ${ROBOTLIT_DB_PASSWORD:?Set ROBOTLIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - robotlit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robotlit -d robotlit"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  robotlit-postgres:
