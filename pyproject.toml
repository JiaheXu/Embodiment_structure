[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robotlit"
version = "0.1.0"
description = "Local, evidence-preserving robot literature assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1", "httpx>=0.28,<1", "PyYAML>=6,<7", "pypdf>=6,<7",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3,<6", "docling>=2,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
robotlit = "robotlit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/robotlit"]
